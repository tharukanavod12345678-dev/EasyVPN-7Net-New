name: Build Easy VPN APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'App Name'
        required: false
        default: 'Easy VPN'
        type: string
      package_name:
        description: 'Package Name'
        required: false
        default: 'com.easy.vpn'
        type: string
      config_url:
        description: 'Server Config JSON URL'
        required: false
        default: 'https://gist.githubusercontent.com/tharukanavod12345678-dev/938e791af1a182faa9ac1a0fc0dd2048/raw/300f244d3e298aa169c20b5b9f345bfd770de102/configs.json'
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository with Submodules
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'
        fetch-depth: 0

    - name: Update and Init Git Submodules Manually
      run: |
        git submodule sync
        git submodule update --init --recursive
        git submodule status
        ls -la AndroidLibXrayLite/ | head -n 10
        ls -la hev-socks5-tunnel/ | head -n 10

    - name: Fix Submodules & Gradle Wrapper
      run: |
        # Fix AndroidLibXrayLite
        if [ ! -f AndroidLibXrayLite/build.gradle.kts ] && [ ! -f AndroidLibXrayLite/build.gradle ]; then
          rm -rf AndroidLibXrayLite
          git clone https://github.com/2dust/AndroidLibXrayLite.git AndroidLibXrayLite --depth 1 --recursive
        fi
        # Fix hev-socks5-tunnel
        if [ ! -d hev-socks5-tunnel/src ]; then
          rm -rf hev-socks5-tunnel
          git clone https://github.com/heiher/hev-socks5-tunnel.git hev-socks5-tunnel --depth 1 --recursive
          cd hev-socks5-tunnel && git submodule update --init --recursive || true; cd ..
        else
          cd hev-socks5-tunnel && git submodule update --init --recursive || true; cd ..
        fi
        # Fix gradle wrapper jar (critical for build)
        if [ ! -f V2rayNG/gradle/wrapper/gradle-wrapper.jar ]; then
          echo "Gradle wrapper jar missing, downloading..."
          mkdir -p V2rayNG/gradle/wrapper/
          # Download gradle wrapper jar from gradle distribution
          curl -L -o V2rayNG/gradle/wrapper/gradle-wrapper.jar https://github.com/gradle/gradle/raw/master/gradle/wrapper/gradle-wrapper.jar 2>/dev/null || true
          # Alternative: use gradle to generate wrapper
          if [ ! -f V2rayNG/gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Trying to find jar in repo..."
            find . -name "gradle-wrapper.jar" | head -n 5
            # Copy from root if exists
            if [ -f gradle/wrapper/gradle-wrapper.jar ]; then
              cp gradle/wrapper/gradle-wrapper.jar V2rayNG/gradle/wrapper/ || true
            fi
          fi
          ls -lh V2rayNG/gradle/wrapper/ | head -n 10
        fi
        echo "Submodules and wrapper fixed"

    - name: Apply Easy VPN Rebranding
      run: |
        APP_NAME="${{ inputs.app_name }}"
        PACKAGE_NAME="${{ inputs.package_name }}"
        CONFIG_URL="${{ inputs.config_url }}"
        if [ -z "$APP_NAME" ]; then APP_NAME="Easy VPN"; fi
        if [ -z "$PACKAGE_NAME" ]; then PACKAGE_NAME="com.easy.vpn"; fi
        if [ -z "$CONFIG_URL" ]; then CONFIG_URL="https://gist.githubusercontent.com/tharukanavod12345678-dev/938e791af1a182faa9ac1a0fc0dd2048/raw/300f244d3e298aa169c20b5b9f345bfd770de102/configs.json"; fi
        echo "App: $APP_NAME, Package: $PACKAGE_NAME"
        GRADLE_FILE="V2rayNG/app/build.gradle.kts"
        [ -f "$GRADLE_FILE" ] && sed -i "s/applicationId = \"com.v2ray.ang\"/applicationId = \"$PACKAGE_NAME\"/g" "$GRADLE_FILE" || true
        find . -name "strings.xml" | while read f; do grep -q "app_name" "$f" && sed -i "s/<string name=\"app_name\">.*<\/string>/<string name=\"app_name\">$APP_NAME<\/string>/g" "$f" || true; done

    - name: Apply 7net Dark Theme & UI
      run: |
        echo "Applying 7net theme"
        if [ -f "easyvpn-patches/MainScreen_7net.kt" ]; then
          cp easyvpn-patches/MainScreen_7net.kt V2rayNG/app/src/main/java/com/v2ray/ang/ui/main/MainScreen.kt || true
        fi
        mkdir -p V2rayNG/app/src/main/res/drawable
        cat > V2rayNG/app/src/main/res/drawable/easyvpn_circle_outer.xml << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval"><solid android:color="#1A2563EB" /><stroke android:width="2dp" android:color="#332563EB" /></shape>
        EOF
        cat > V2rayNG/app/src/main/res/drawable/easyvpn_circle_middle.xml << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval"><solid android:color="#332563EB" /><stroke android:width="1dp" android:color="#4D3B82F6" /></shape>
        EOF

    - name: Apply Auto-Update Mechanism
      run: |
        CONFIG_URL="${{ inputs.config_url }}"
        if [ -z "$CONFIG_URL" ]; then CONFIG_URL="https://gist.githubusercontent.com/tharukanavod12345678-dev/938e791af1a182faa9ac1a0fc0dd2048/raw/300f244d3e298aa169c20b5b9f345bfd770de102/configs.json"; fi
        if [ -f "easyvpn-patches/EasyVpnAutoUpdateManager.kt" ]; then
          cp easyvpn-patches/EasyVpnAutoUpdateManager.kt V2rayNG/app/src/main/java/com/v2ray/ang/util/EasyVpnAutoUpdateManager.kt || true
          sed -i "s|https://gist.githubusercontent.com/tharukanavod12345678-dev/938e791af1a182faa9ac1a0fc0dd2048/raw/300f244d3e298aa169c20b5b9f345bfd770de102/configs.json|$CONFIG_URL|g" V2rayNG/app/src/main/java/com/v2ray/ang/util/EasyVpnAutoUpdateManager.kt || true
        fi
        MAIN_ACTIVITY="V2rayNG/app/src/main/java/com/v2ray/ang/ui/main/MainActivity.kt"
        if [ -f "$MAIN_ACTIVITY" ]; then
          if ! grep -q "EasyVpnAutoUpdateManager" "$MAIN_ACTIVITY"; then sed -i '/import com.v2ray.ang.util.Utils/a import com.v2ray.ang.util.EasyVpnAutoUpdateManager' "$MAIN_ACTIVITY" || true; fi
          if ! grep -q "autoUpdateOnAppStart" "$MAIN_ACTIVITY"; then sed -i '/mainViewModel.onAction(MainAction.Initialize)/a \        EasyVpnAutoUpdateManager.autoUpdateOnAppStart(this)' "$MAIN_ACTIVITY" || true; fi
        fi

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

    - name: Install NDK
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --channel=0 --install "ndk;29.0.14206865"
        echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV

    - name: Build libhevtun
      run: |
        cd V2rayNG
        if [ -f compile-hevtun.sh ]; then bash compile-hevtun.sh || true; mkdir -p app/libs/; cp -r libs/* app/libs/ 2>/dev/null || true; ls -lh app/libs/ | head -n 10; fi

    - name: Fetch Xray Core Tag & Download libv2ray.aar
      run: |
        cd V2rayNG
        if [ -d AndroidLibXrayLite ]; then
          pushd AndroidLibXrayLite
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v25.11.14")
          echo "CURRENT_TAG=$TAG" >> $GITHUB_ENV
          echo "Tag: $TAG"
          popd
        else
          echo "CURRENT_TAG=v25.11.14" >> $GITHUB_ENV
        fi
        # Download with retry and check file size
        TAG="${{ env.CURRENT_TAG }}"
        if [ -z "$TAG" ]; then TAG="v25.11.14"; fi
        echo "Downloading libv2ray.aar for tag $TAG"
        mkdir -p app/libs/
        # Try multiple tags
        for TRY_TAG in "$TAG" "v25.11.14" "v25.10.31" "v25.9.30" "v1.8.24"; do
          echo "Trying tag $TRY_TAG..."
          curl -L -o app/libs/libv2ray.aar "https://github.com/2dust/AndroidLibXrayLite/releases/download/$TRY_TAG/libv2ray.aar" 2>&1 | tail -n 5
          SIZE=$(stat -c%s app/libs/libv2ray.aar 2>/dev/null || echo 0)
          echo "Size: $SIZE"
          if [ "$SIZE" -gt 1000000 ]; then
            echo "Download success with tag $TRY_TAG, size $SIZE"
            echo "CURRENT_TAG=$TRY_TAG" >> $GITHUB_ENV
            break
          fi
          rm -f app/libs/libv2ray.aar
        done
        ls -lh app/libs/ || true

    - name: Setup Java 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Build Easy VPN Debug APK
      run: |
        cd V2rayNG
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        chmod +x gradlew
        # Ensure wrapper jar exists
        if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
          echo "Wrapper jar missing, trying to download gradle..."
          # Download gradle wrapper jar from official
          curl -L -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/master/gradle/wrapper/gradle-wrapper.jar || true
          ls -lh gradle/wrapper/
        fi
        ls -lh gradle/wrapper/ || true
        ./gradlew assembleFdroidDebug --stacktrace || ./gradlew assembleDebug --stacktrace

    - name: Prepare APKs
      if: always()
      run: |
        find . -name "*.apk" -type f | head -n 20
        mkdir -p artifacts
        find . -name "*.apk" -type f -exec cp {} artifacts/ \; || true
        ls -lh artifacts/

    - name: Upload APK Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: EasyVPN-APKs
        path: artifacts/
        if-no-files-found: error
