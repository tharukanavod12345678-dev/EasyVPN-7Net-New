name: Build Easy VPN APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'App Name'
        required: false
        default: 'Easy VPN'
        type: string
      package_name:
        description: 'Package Name'
        required: false
        default: 'com.easy.vpn'
        type: string
      config_url:
        description: 'Server Config JSON URL'
        required: false
        default: 'https://gist.githubusercontent.com/tharukanavod12345678-dev/938e791af1a182faa9ac1a0fc0dd2048/raw/300f244d3e298aa169c20b5b9f345bfd770de102/configs.json'
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository with Submodules
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'
        fetch-depth: 0

    - name: Update and Init Git Submodules Manually
      run: |
        git submodule sync
        git submodule update --init --recursive
        git submodule status

    - name: Fix Submodules
      run: |
        if [ ! -f AndroidLibXrayLite/build.gradle.kts ] && [ ! -f AndroidLibXrayLite/build.gradle ]; then
          rm -rf AndroidLibXrayLite
          git clone https://github.com/2dust/AndroidLibXrayLite.git AndroidLibXrayLite --depth 1 --recursive
        fi
        if [ ! -d hev-socks5-tunnel/src ]; then
          rm -rf hev-socks5-tunnel
          git clone https://github.com/heiher/hev-socks5-tunnel.git hev-socks5-tunnel --depth 1 --recursive
          cd hev-socks5-tunnel && git submodule update --init --recursive || true; cd ..
        else
          cd hev-socks5-tunnel && git submodule update --init --recursive || true; cd ..
        fi

    - name: Apply Easy VPN Rebranding
      run: |
        APP_NAME="${{ inputs.app_name }}"
        PACKAGE_NAME="${{ inputs.package_name }}"
        if [ -z "$APP_NAME" ]; then APP_NAME="Easy VPN"; fi
        if [ -z "$PACKAGE_NAME" ]; then PACKAGE_NAME="com.easy.vpn"; fi
        GRADLE_FILE="V2rayNG/app/build.gradle.kts"
        [ -f "$GRADLE_FILE" ] && sed -i "s/applicationId = \"com.v2ray.ang\"/applicationId = \"$PACKAGE_NAME\"/g" "$GRADLE_FILE" || true
        find . -name "strings.xml" | while read f; do grep -q "app_name" "$f" && sed -i "s/<string name=\"app_name\">.*<\/string>/<string name=\"app_name\">$APP_NAME<\/string>/g" "$f" || true; done

    - name: Apply 7net Dark Theme & UI (Drawables Only - MainScreen fix pending)
      run: |
        # NOTE: Custom MainScreen_7net.kt currently disabled for build stability
        # It had conflicting overloads and outdated ProfileItem APIs (guid, remarks, profiles)
        # Keeping official MainScreen.kt for now, only applying 7net drawables for future use
        mkdir -p V2rayNG/app/src/main/res/drawable
        cat > V2rayNG/app/src/main/res/drawable/easyvpn_circle_outer.xml << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval"><solid android:color="#1A2563EB" /><stroke android:width="2dp" android:color="#332563EB" /></shape>
        EOF
        cat > V2rayNG/app/src/main/res/drawable/easyvpn_circle_middle.xml << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval"><solid android:color="#332563EB" /><stroke android:width="1dp" android:color="#4D3B82F6" /></shape>
        EOF
        # Optional: Apply dark theme colors via colors.xml override if exists
        echo "7net drawables created, skipping MainScreen custom UI for stable build"
        ls -lh V2rayNG/app/src/main/res/drawable/ | grep easyvpn || true

    - name: Apply Auto-Update Mechanism
      run: |
        CONFIG_URL="${{ inputs.config_url }}"
        if [ -z "$CONFIG_URL" ]; then CONFIG_URL="https://gist.githubusercontent.com/tharukanavod12345678-dev/938e791af1a182faa9ac1a0fc0dd2048/raw/300f244d3e298aa169c20b5b9f345bfd770de102/configs.json"; fi
        if [ -f "easyvpn-patches/EasyVpnAutoUpdateManager.kt" ]; then
          cp easyvpn-patches/EasyVpnAutoUpdateManager.kt V2rayNG/app/src/main/java/com/v2ray/ang/util/EasyVpnAutoUpdateManager.kt || true
          sed -i "s|https://gist.githubusercontent.com/tharukanavod12345678-dev/938e791af1a182faa9ac1a0fc0dd2048/raw/300f244d3e298aa169c20b5b9f345bfd770de102/configs.json|$CONFIG_URL|g" V2rayNG/app/src/main/java/com/v2ray/ang/util/EasyVpnAutoUpdateManager.kt || true
        fi
        MAIN_ACTIVITY="V2rayNG/app/src/main/java/com/v2ray/ang/ui/main/MainActivity.kt"
        if [ -f "$MAIN_ACTIVITY" ]; then
          if ! grep -q "EasyVpnAutoUpdateManager" "$MAIN_ACTIVITY"; then sed -i '/import com.v2ray.ang.util.Utils/a import com.v2ray.ang.util.EasyVpnAutoUpdateManager' "$MAIN_ACTIVITY" || true; fi
          if ! grep -q "autoUpdateOnAppStart" "$MAIN_ACTIVITY"; then sed -i '/mainViewModel.onAction(MainAction.Initialize)/a \        EasyVpnAutoUpdateManager.autoUpdateOnAppStart(this)' "$MAIN_ACTIVITY" || true; fi
        fi

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

    - name: Install NDK
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --channel=0 --install "ndk;29.0.14206865"
        echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV

    - name: Build libhevtun
      run: |
        echo "NDK_HOME=$NDK_HOME"
        echo "Building hev-socks5-tunnel..."
        ls -ld hev-socks5-tunnel || echo "hev-socks5-tunnel missing at root, checking V2rayNG"
        ls -ld V2rayNG/hev-socks5-tunnel || true
        # Ensure hev-socks5-tunnel exists at root for compile-hevtun.sh
        if [ ! -d hev-socks5-tunnel ] && [ -d V2rayNG/hev-socks5-tunnel ]; then
          cp -r V2rayNG/hev-socks5-tunnel hev-socks5-tunnel || true
        fi
        if [ ! -d hev-socks5-tunnel ]; then
          echo "Cloning hev-socks5-tunnel to root..."
          rm -rf hev-socks5-tunnel
          git clone https://github.com/heiher/hev-socks5-tunnel.git hev-socks5-tunnel --depth 1 --recursive
          cd hev-socks5-tunnel && git submodule update --init --recursive || true; cd ..
        fi
        ls -lh hev-socks5-tunnel/ | head -n 20
        # Build using official method - script in root
        if [ -f compile-hevtun.sh ]; then
          bash compile-hevtun.sh
        elif [ -f V2rayNG/compile-hevtun.sh ]; then
          # Fallback if script in V2rayNG
          cp V2rayNG/compile-hevtun.sh ./compile-hevtun.sh
          bash compile-hevtun.sh
        else
          echo "compile-hevtun.sh not found!"
          find . -name "compile-hevtun.sh"
        fi
        echo "=== Built libs ==="
        ls -R libs/ | head -n 50
        echo "=== Copying to V2rayNG/app/libs ==="
        mkdir -p V2rayNG/app/libs
        cp -r libs/* V2rayNG/app/libs/ 2>/dev/null || cp -r libs V2rayNG/app/ || true
        ls -R V2rayNG/app/libs/ | head -n 100

    - name: Fetch Xray Core Tag
      run: |
        cd V2rayNG
        if [ -d AndroidLibXrayLite ]; then
          pushd AndroidLibXrayLite
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v26.9.9")
          echo "CURRENT_TAG=$TAG" >> $GITHUB_ENV
          echo "Tag: $TAG"
          popd
        else
          echo "CURRENT_TAG=v26.9.9" >> $GITHUB_ENV
        fi

    - name: Download libv2ray.aar
      uses: robinraju/release-downloader@v1.11
      with:
        repository: '2dust/AndroidLibXrayLite'
        tag: ${{ env.CURRENT_TAG }}
        fileName: 'libv2ray.aar'
        out-file-path: V2rayNG/app/libs/
      continue-on-error: true

    - name: Download libv2ray Fallback
      if: always()
      run: |
        ls -lh V2rayNG/app/libs/ || true
        SIZE=$(stat -c%s V2rayNG/app/libs/libv2ray.aar 2>/dev/null || echo 0)
        echo "Current size: $SIZE"
        if [ "$SIZE" -lt 1000000 ]; then
          echo "Primary download failed, trying fallback tags..."
          rm -f V2rayNG/app/libs/libv2ray.aar
          for TAG in "v26.9.9" "v26.8.20" "v26.7.31" "v25.11.14" "v25.10.31"; do
            echo "Trying $TAG..."
            curl -L -o V2rayNG/app/libs/libv2ray.aar "https://github.com/2dust/AndroidLibXrayLite/releases/download/$TAG/libv2ray.aar" || true
            SIZE=$(stat -c%s V2rayNG/app/libs/libv2ray.aar 2>/dev/null || echo 0)
            echo "Size: $SIZE"
            if [ "$SIZE" -gt 1000000 ]; then
              echo "Success with $TAG"
              break
            fi
          done
        fi
        ls -lh V2rayNG/app/libs/

    - name: Setup Java 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Build Easy VPN Debug APK
      run: |
        cd V2rayNG
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
          echo "gradle-wrapper.jar missing, restoring from official..."
          mkdir -p gradle/wrapper
          VER=$(grep distributionUrl gradle/wrapper/gradle-wrapper.properties | grep -oE 'gradle-[0-9.]+' | grep -oE '[0-9.]+' | head -n1)
          if [ -z "$VER" ]; then VER="8.7"; fi
          echo "Gradle version: $VER"
          # Download correct jar for this gradle version
          curl -L -o gradle/wrapper/gradle-wrapper.jar https://github.com/gradle/gradle/raw/v${VER}.0/gradle/wrapper/gradle-wrapper.jar || true
          if [ $(stat -c%s gradle/wrapper/gradle-wrapper.jar 2>/dev/null || echo 0) -lt 1000 ]; then
            curl -L -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/master/gradle/wrapper/gradle-wrapper.jar || true
          fi
          # If still failing, try to copy from local .git history or use gradle to generate
          if [ $(stat -c%s gradle/wrapper/gradle-wrapper.jar 2>/dev/null || echo 0) -lt 1000 ]; then
            echo "Attempting to generate wrapper jar via gradle..."
            # Use available gradle if any
            if command -v gradle >/dev/null 2>&1; then gradle wrapper || true; fi
          fi
        fi
        chmod +x gradlew
        ls -lh gradle/wrapper/ || true
        ls -lh app/libs/ || true
        ./gradlew assembleFdroidDebug --stacktrace

    - name: Prepare APKs
      if: always()
      run: |
        find . -name "*.apk" -type f | head -n 20
        mkdir -p artifacts
        find . -name "*.apk" -type f -exec cp {} artifacts/ \; || true
        ls -lh artifacts/

    - name: Upload APK Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: EasyVPN-APKs
        path: artifacts/
        if-no-files-found: error
